<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#0e0618" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Neon Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#d9048e" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Cyber Panel -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Cyan Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#boxGlow)" />

  <!-- Inner Tech Dashed Grid Line -->
  <rect x="44" y="44" width="424" height="424" rx="94" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="16 10" />

  <!-- Cyber Tech Corners (HUD Lock-on style) -->
  <path d="M 60 120 L 60 60 L 120 60" fill="none" stroke="#ff007f" stroke-width="7" stroke-linecap="round" />
  <path d="M 392 60 L 452 60 L 452 120" fill="none" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" />
  <path d="M 60 392 L 60 452 L 120 452" fill="none" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" />
  <path d="M 392 452 L 452 452 L 452 392" fill="none" stroke="#ff007f" stroke-width="7" stroke-linecap="round" />

  <!-- Subtle Interior Ambient Glow -->
  <circle cx="170" cy="200" r="110" fill="#00f3ff" opacity="0.09" filter="url(#cyanGlow)" />
  <circle cx="340" cy="340" r="110" fill="#ff007f" opacity="0.09" filter="url(#pinkGlow)" />

  <!-- Live Status Pulse Indicator (Top Right) -->
  <circle cx="414" cy="98" r="14" fill="#00ff9d" filter="url(#boxGlow)" />

  <!-- Cyber Terminal Prompt '> ' (Sharp Neon Cyan Chevron) -->
  <path d="M 140 160 L 268 256 L 140 352" fill="none" stroke="url(#cyanGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />

  <!-- Cyber Terminal Underscore '_ ' (Sharp Neon Pink Block) -->
  <line x1="292" y1="352" x2="388" y2="352" stroke="url(#pinkGrad)" stroke-width="46" stroke-linecap="round" filter="url(#pinkGlow)" />
</svg>
